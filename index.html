<style>
/* Layout: nav on top; left times, centre timer, right goals/stats, bottom charts. Pages (stats/algs/solver/prac) replace the 3 middle rows. */
:root{--h:275;--as:90%;--al:58%;--a:hsl(var(--h) var(--as) var(--al));--a2:hsl(var(--h) 80% 40%);--on:#fff;--tx:#f1eeff;--mu:#8d8d98;--bg:#050506;--cdr:6,4,16;--ga:.68;--cd:rgba(var(--cdr),var(--ga));--ln:hsl(var(--h) 70% 65%/.28);--pop:#0d0d10;--fld:rgba(255,255,255,.07);--hov:rgba(255,255,255,.08);--rad:16px;--rad2:4px;--fs:13px;--bgo:1;--dim:0;--bgb:0px;--ts:1;--gbf:none;--glow:.08;--tf:'Chakra Petch',Sora,system-ui,sans-serif;--ok:#6dffa8;--warn:#ffd166;--bad:#ff6b7a;color-scheme:dark}

<script>
/* ===== CubeCore: 54-facelet model, move parser, geometry (shared by timer, 3D viewer, solver) ===== */
const CubeCore=(()=>{
const FACES='URFDLB',SOLVED='UUUUUUUUURRRRRRRRRFFFFFFFFFDDDDDDDDDLLLLLLLLLBBBBBBBBB';
// facelet index -> position (x,y,z) and normal. x=R+, y=U+, z=F+
function geo(i){const f=i/9|0,r=(i%9)/3|0,c=i%3;
 switch(f){case 0:return{p:[c-1,1,r-1],n:[0,1,0]};case 1:return{p:[1,1-r,1-c],n:[1,0,0]};case 2:return{p:[c-1,1-r,1],n:[0,0,1]};
 case 3:return{p:[c-1,-1,1-r],n:[0,-1,0]};case 4:return{p:[-1,1-r,c-1],n:[-1,0,0]};default:return{p:[1-c,1-r,-1],n:[0,0,-1]}}}
const G=Array.from({length:54},(_,i)=>geo(i));
const key=(p,n)=>p.join(',')+'|'+n.join(',');
const SLOT={};G.forEach((g,i)=>SLOT[key(g.p,g.n)]=i);
// MV: face -> [axis, layer predicate on coordinate, sign]  (sign: +1 = +90deg about +axis for one clockwise turn)
const AX={x:0,y:1,z:2};
const MV={U:['y',v=>v==1,-1],D:['y',v=>v==-1,1],R:['x',v=>v==1,-1],L:['x',v=>v==-1,1],F:['z',v=>v==1,-1],B:['z',v=>v==-1,1],
 u:['y',v=>v>=0,-1],d:['y',v=>v<=0,1],r:['x',v=>v>=0,-1],l:['x',v=>v<=0,1],f:['z',v=>v>=0,-1],b:['z',v=>v<=0,1],
 M:['x',v=>v==0,1],E:['y',v=>v==0,1],S:['z',v=>v==0,-1],x:['x',v=>1,-1],y:['y',v=>1,-1],z:['z',v=>1,-1]};
// rotate vector by k quarter turns about axis (right-handed, k may be negative)
function rotv(v,ax,k){k=((k%4)+4)%4;let [x,y,z]=v;for(let i=0;i<k;i++){if(ax=='x')[y,z]=[-z,y];else if(ax=='y')[x,z]=[z,-x];else[x,y]=[-y,x]}return[x,y,z]}
// permutation for a single move {f,n}: newState[perm[i]]=state[i]
const permCache={};
function perm(m){const k=m.f+m.n;if(permCache[k])return permCache[k];const[ax,pred,sg]=MV[m.f],a=AX[ax],q=sg*m.n,P=new Array(54);
 for(let i=0;i<54;i++){const g=G[i];if(pred(g.p[a])){P[i]=SLOT[key(rotv(g.p,ax,q),rotv(g.n,ax,q))]}else P[i]=i}
 return permCache[k]=P}
function apply(st,m){const P=perm(m),o=st.slice?st.slice():Array.from(st);const r=new Array(54);for(let i=0;i<54;i++)r[P[i]]=o[i];return typeof st=='string'?r.join(''):r}
const inv=m=>({f:m.f,n:m.n==2?2:-m.n,t:m.t});
const invt=t=>/2'?$/.test(t)?t.replace("'",''):t.endsWith("'")?t.slice(0,-1):t+"'";
const MR=/[URFDLBurfdlbMESxyz]w?(?:2'|2|')?/g;
function parse(s){s=String(s).replace(/[’′‘`]/g,"'").replace(/[↑↓]/g,'').replace(/\(([^()]*)\)\s*x(\d)/g,(_,a,n)=>(a+' ').repeat(+n)).replace(/\(([^()]*)\)'/g,(_,a)=>(a.match(MR)||[]).reverse().map(invt).join(' '));
 return(s.match(MR)||[]).map(t=>{let f=t[0];if(t[1]=='w')f=f.toLowerCase();return{f,n:t.endsWith("'")&&!t.endsWith("2'")?-1:t.includes('2')?2:1,t:t.replace('w','w')}})}
function run(st,alg){const ms=typeof alg=='string'?parse(alg):alg;for(const m of ms)st=apply(st,m);return st}
const invAlg=ms=>ms.slice().reverse().map(inv);
const mstr=ms=>ms.map(m=>m.f+(m.n==2?'2':m.n<0?"'":'')).join(' ');
return{FACES,SOLVED,G,SLOT,MV,AX,rotv,perm,apply,run,parse,inv,invAlg,mstr,invt,key};
})();


/* ===== NCube: generic NxN sticker model (N = 2,3,4,...) =====
   Sticker index i = face*N*N + row*N + col, faces in order U R F D L B (same facelet layout as CubeCore, row-major, viewed from outside).
   Geometry: cubie coordinates are 2k-(N-1) (k=0..N-1); a sticker sits on the plane +-N of its face.
   Move object: {f:'U'|'R'|'F'|'D'|'L'|'B', a:first layer (1=outer), b:last layer, n:1|2|-1}
   Notation: "R" outer layer, "Rw" layers 1-2, "3Rw" layers 1-3, "2R" layer 2 only, "2-3R" layers 2-3, suffix ' or 2. */
const NCube=(()=>{
const FACES='URFDLB';
const AXN={U:[0,1,0],D:[0,-1,0],R:[1,0,0],L:[-1,0,0],F:[0,0,1],B:[0,0,-1]};
const MAXIS={U:['y',-1],D:['y',1],R:['x',-1],L:['x',1],F:['z',-1],B:['z',1]};   // axis, sign of a clockwise turn
const AI={x:0,y:1,z:2};
function rotv(v,ax,k){k=((k%4)+4)%4;let[x,y,z]=v;for(let i=0;i<k;i++){if(ax=='x')[y,z]=[-z,y];else if(ax=='y')[x,z]=[z,-x];else[x,y]=[-y,x]}return[x,y,z]}
const cache={};
function make(N){
 if(cache[N])return cache[N];
 const u=k=>2*k-(N-1),NN=N*N,TOT=6*NN,G=[],SLOT=new Map(),key=(p,n)=>p.join(',')+'|'+n.join(',');
 for(let i=0;i<TOT;i++){const f=i/NN|0,r=((i%NN)/N)|0,c=i%N;let p,n;
  switch(f){case 0:n=[0,1,0];p=[u(c),N,u(r)];break;case 1:n=[1,0,0];p=[N,-u(r),-u(c)];break;case 2:n=[0,0,1];p=[u(c),-u(r),N];break;
   case 3:n=[0,-1,0];p=[u(c),-N,-u(r)];break;case 4:n=[-1,0,0];p=[-N,-u(r),u(c)];break;default:n=[0,0,-1];p=[-u(c),-u(r),-N]}
  G.push({p,n,f,r,c});SLOT.set(key(p,n),i)}
 const layerOf=(f,p)=>{const a=AI[MAXIS[f][0]],w=p[a],pos=AXN[f][a]>0;return pos?(N-1-w)/2+1:(w+N-1)/2+1};
 const pc={};
 function perm(m){const k=m.f+m.a+'-'+m.b+':'+m.n;if(pc[k])return pc[k];const[ax,sg]=MAXIS[m.f],a=AI[ax],q=sg*m.n,P=new Array(TOT);
  for(let i=0;i<TOT;i++){const g=G[i];let moved=false;
   // a sticker belongs to the turning slab if its cubie's coordinate (on the move axis) lies in the layers; sticker on the face plane of the axis has coord +-N -> counts as layer 1 of that face
   const w=g.p[a];const inFace=Math.abs(w)==N;const cw=inFace?(w>0?N-1:-(N-1)):w;const lay=AXN[m.f][a]>0?(N-1-cw)/2+1:(cw+N-1)/2+1;
   if(lay>=m.a&&lay<=m.b)moved=true;
   P[i]=moved?SLOT.get(key(rotv(g.p,ax,q),rotv(g.n,ax,q))):i}
  return pc[k]=P}
 const apply=(st,m)=>{const P=perm(m),r=new Array(TOT);for(let i=0;i<TOT;i++)r[P[i]]=st[i];return r};
 const run=(st,ms)=>{for(const m of ms)st=apply(st,m);return st};
 const inv=m=>({f:m.f,a:m.a,b:m.b,n:m.n==2?2:-m.n});
 const invAlg=ms=>ms.slice().reverse().map(inv);
 const solved=()=>{const s=[];for(let i=0;i<TOT;i++)s.push(i/NN|0);return s};
 function parseOne(t){const mm=/^(?:(\d)(?:-(\d))?)?([URFDLB])(w)?(2'|2|')?$/.exec(t);if(!mm)return null;
  let a=1,b=1;const f=mm[3];
  if(mm[1]){if(mm[2]){a=+mm[1];b=+mm[2]}else if(mm[4]){a=1;b=+mm[1]}else{a=+mm[1];b=a}}else if(mm[4]){a=1;b=2}
  const s=mm[5]||'';return{f,a,b,n:s=='2'||s=="2'"?2:s=="'"?-1:1}}
 const parse=str=>String(str).replace(/[’′‘`]/g,"'").split(/\s+/).filter(Boolean).map(parseOne).filter(Boolean);
 function fmt(m){let s;const{f,a,b}=m;if(a==1&&b==1)s=f;else if(a==1&&b==2)s=f+'w';else if(a==1)s=b+f+'w';else if(a==b)s=a+f;else s=a+'-'+b+f;return s+(m.n==2?'2':m.n<0?"'":'')}
 const fmtAll=ms=>ms.map(fmt).join(' ');
 const T={N,NN,TOT,G,SLOT,key,perm,apply,run,inv,invAlg,solved,parse,parseOne,fmt,fmtAll,layerOf};
 return cache[N]=T}
return{make,rotv,AXN,MAXIS,AI,FACES};
})();


/* ===== Solver: Kociemba two-phase on top of CubeCore ===== */
const Solver=(()=>{
const CC=typeof CubeCore!='undefined'?CubeCore:require('./core.js');
const CF=[[8,9,20],[6,18,38],[0,36,47],[2,45,11],[29,26,15],[27,44,24],[33,53,42],[35,17,51]];
const EF=[[5,10],[7,19],[3,37],[1,46],[32,16],[28,25],[30,43],[34,52],[23,12],[21,41],[50,39],[48,14]];
const CCOL=['URF','UFL','ULB','UBR','DFR','DLF','DBL','DRB'],ECOL=['UR','UF','UL','UB','DR','DF','DL','DB','FR','FL','BL','BR'];
const NM={U:'U',R:'R',F:'F',D:'D',L:'L',B:'B'};
let ready=false,T={};
const fact=[1,1,2,6,24,120,720,5040,40320];
const Cnk=(n,k)=>{if(k>n||k<0)return 0;let r=1;for(let i=0;i<k;i++)r=r*(n-i)/(i+1);return Math.round(r)};

/* facelet string (chars U,R,F,D,L,B) -> cubie {cp,co,ep,eo} or error code */
function toCubie(s){
 const cp=[],co=[],ep=[],eo=[];
 for(let i=0;i<8;i++){let o=0;for(;o<3;o++){const c=s[CF[i][o]];if(c=='U'||c=='D')break}
  if(o==3)return{err:'cubies'};
  const a=s[CF[i][(o+1)%3]],b=s[CF[i][(o+2)%3]];let found=-1;
  for(let j=0;j<8;j++)if(CCOL[j][1]==a&&CCOL[j][2]==b){found=j;break}
  if(found<0)return{err:'cubies'};cp[i]=found;co[i]=o}
 for(let i=0;i<12;i++){const a=s[EF[i][0]],b=s[EF[i][1]];let f=-1,fl=0;
  for(let j=0;j<12;j++){if(ECOL[j][0]==a&&ECOL[j][1]==b){f=j;fl=0;break}if(ECOL[j][0]==b&&ECOL[j][1]==a){f=j;fl=1;break}}
  if(f<0)return{err:'cubies'};ep[i]=f;eo[i]=fl}
 return{cp,co,ep,eo}}
function mult(a,b){const cp=[],co=[],ep=[],eo=[];
 for(let c=0;c<8;c++){cp[c]=a.cp[b.cp[c]];co[c]=(a.co[b.cp[c]]+b.co[c])%3}
 for(let e=0;e<12;e++){ep[e]=a.ep[b.ep[e]];eo[e]=(a.eo[b.ep[e]]+b.eo[e])%2}
 return{cp,co,ep,eo}}
function parity(p){let s=0;const n=p.length;for(let i=0;i<n;i++)for(let j=i+1;j<n;j++)if(p[i]>p[j])s++;return s&1}
function check(c){
 if(c.err)return c.err;
 const sc=new Set(c.cp),se=new Set(c.ep);if(sc.size!=8||se.size!=12)return'cubies';
 if(c.co.reduce((a,b)=>a+b,0)%3)return'twist';
 if(c.eo.reduce((a,b)=>a+b,0)%2)return'flip';
 if(parity(c.cp)!=parity(c.ep))return'parity';
 return'ok'}
/* validate a facelet string; returns code */
function validate(s){
 if(!s||s.length!=54||/[^URFDLB]/.test(s))return'colors';
 for(const f of 'URFDLB'){if(s.split(f).length-1!=9)return'colors'}
 const cen=[4,13,22,31,40,49];
 return check(toCubie(s))}

/* ---- coordinates ---- */
const twistOf=co=>{let t=0;for(let i=0;i<7;i++)t=t*3+co[i];return t};
const flipOf=eo=>{let t=0;for(let i=0;i<11;i++)t=t*2+eo[i];return t};
const sliceOf=ep=>{let a=0,x=0;for(let j=11;j>=0;j--)if(ep[j]>=8){a+=Cnk(11-j,x+1);x++}return a};
function rankPerm(p,n){let r=0;for(let i=0;i<n-1;i++){let c=0;for(let j=i+1;j<n;j++)if(p[j]<p[i])c++;r=r*(n-i)+c}return r}
function unrankPerm(r,n){const p=new Array(n),d=[];for(let i=n-2;i>=0;i--){d[i]=r%(n-i);r=r/(n-i)|0}
 const used=new Array(n).fill(0);for(let i=0;i<n;i++){let c=i<n-1?d[i]:0,k=0;for(let v=0;v<n;v++){if(used[v])continue;if(k==c){p[i]=v;used[v]=1;break}k++}}return p}
function prep(){
 if(ready)return;
 // basic move cubies derived from facelet geometry
 const MOVES=[];const base=CC.SOLVED;
 for(const f of 'URFDLB'){let st=base;const one=CC.parse(f)[0],cs=[];for(let p=0;p<3;p++){st=CC.apply(st,one);cs.push(toCubie(st))}MOVES.push(...cs)}
 T.mv=MOVES;
 const nm=18;
 // twist
 T.twM=new Uint16Array(2187*nm);T.flM=new Uint16Array(2048*nm);T.slM=new Uint16Array(495*nm);
 for(let t=0;t<2187;t++){const co=[];let x=t,s=0;for(let i=6;i>=0;i--){co[i]=x%3;x=x/3|0;s+=co[i]}co[7]=(3-s%3)%3;
  for(let m=0;m<nm;m++){const mv=MOVES[m],n=[];for(let c=0;c<8;c++)n[c]=(co[mv.cp[c]]+mv.co[c])%3;T.twM[t*nm+m]=twistOf(n)}}

let algT='PLL',algQ='',algF='all';
const isL=c=>!!S.learned[ckey(c)],isF=c=>!!S.fav[ckey(c)];
function renderAlgs(){if(algT=='GUIDE'){renderGuide();return}renderAlgs0()}
function renderAlgs0(){const learnOn=S.f_learn,done=CASES[algT].filter(isL).length;
 $('#algs').innerHTML=`<div class="ph"><h3>${t('algs')}</h3>${Object.keys(CASES).map(k=>`<button class="tab ${k==algT?'on':''}" data-t="${k}">${k} <small>${CASES[k].length}</small></button>`).join('')}<button class="tab" data-t="GUIDE">${gdt('tab')}</button><span class="sp"></span>${learnOn?`<select id="af"><option value="all" ${algF=='all'?'selected':''}>${t('fAll')}</option><option value="fav" ${algF=='fav'?'selected':''}>${t('fFav')}</option><option value="lrn" ${algF=='lrn'?'selected':''}>${t('fLrn')}</option><option value="todo" ${algF=='todo'?'selected':''}>${t('fTodo')}</option></select>`:''}<input type="search" id="aq" placeholder="${esc(t('searchAlg'))}" value="${esc(algQ)}" style="min-width:200px"></div>${learnOn?`<div class="bar" style="margin:0 0 4px"><i id="aprog" style="width:${done/CASES[algT].length*100}%"></i></div><div style="color:var(--mu);font-size:11px" id="acnt">${t('progress',done,CASES[algT].length)}</div>`:''}<div class="ag" id="ag"></div><p class="note">${t('algCredit')}</p>`;
 algGrid();const q=$('#aq');q.oninput=()=>{algQ=q.value;algGrid()};const f=$('#af');if(f)f.onchange=()=>{algF=f.value;algGrid()}}
function algGrid(){const learnOn=S.f_learn;let h='';
 CASES[algT].forEach((c,i)=>{if(algQ&&!(c.n+' '+c.algs.join(' ')).toLowerCase().includes(algQ.toLowerCase()))return;
  if(learnOn){if(algF=='fav'&&!isF(c))return;if(algF=='lrn'&&!isL(c))return;if(algF=='todo'&&isL(c))return}
  h+=`<div class="ac2 ${learnOn&&isL(c)?'lrn':''}" data-i="${i}"><button class="imgw" data-o="${i}" title="${esc(t('viewCase'))}" aria-label="${esc(t('viewCase'))} ${c.n}"><img src="data:image/webp;base64,${c.img}" alt="${c.n}"></button><div class="ab"><div class="ah"><b>${c.n}</b>${learnOn?`<button class="ic ${isF(c)?'on':''}" data-fav="${i}" title="${t('fFav')}">★</button><button class="ic lr ${isL(c)?'on':''}" data-lrn="${i}" title="${t('learned')}">✓</button>`:''}</div>${c.algs.map((a,j)=>`<div class="al" data-i="${i}" data-j="${j}"><code>${esc(a)}</code><button class="btn pr" data-p="1">3D</button></div>`).join('')}</div></div>`});
 $('#ag').innerHTML=h||`<div style="color:var(--mu)">${t('noCases')}</div>`}
$('#algs').onclick=e=>{const tb=e.target.closest('[data-t]'),o=e.target.closest('[data-o]'),fv=e.target.closest('[data-fav]'),lr=e.target.closest('[data-lrn]'),al=e.target.closest('.al');
 if(tb){algT=tb.dataset.t;renderAlgs();return}
 if(o){const c=CASES[algT][+o.dataset.o];openViewer(c.algs[0],c.n);return}
 if(fv){const c=CASES[algT][+fv.dataset.fav];S.fav[ckey(c)]=!S.fav[ckey(c)];save();algGrid();return}
 if(lr){const c=CASES[algT][+lr.dataset.lrn];S.learned[ckey(c)]=!S.learned[ckey(c)];save();algGrid();const d=CASES[algT].filter(isL).length;if($('#acnt'))$('#acnt').textContent=t('progress',d,CASES[algT].length);if($('#aprog'))$('#aprog').style.width=d/CASES[algT].length*100+'%';checkAch();return}
 if(al){const c=CASES[algT][+al.dataset.i],a=c.algs[+al.dataset.j];if(e.target.closest('.pr'))openViewer(a,c.n);else copyText(clean(a),t('copied')+' '+clean(a))}};
/* ---------- practice / viewer ---------- */
let PV=null;
function pui(){$('#pm').innerHTML=movesHtml(PV,'pm');$('#pp').textContent=PV.playing?t('pause'):t('play')}
function setPrac(alg,name){$('#pa').value=alg;PV.set(CC.parse(alg));$('#pn').textContent=name||t('practice');const hid=$('#phd').checked&&name;$('#pa').style.filter=hid?'blur(7px)':'';$('#pm').style.visibility=hid?'hidden':''}
function initPrac(){
 if(!PV){PV=Player($('#c3'),pui);
  $('#pmv').innerHTML=['U','D','R','L','F','B'].map(f=>`<button class="btn" data-m="${f}">${f}</button><button class="btn" data-m="${f}'">${f}'</button>`).join('');
  $('#pmv').onclick=e=>{const b=e.target.closest('[data-m]');if(b)PV.manual(CC.parse(b.dataset.m)[0])};
  $('#pa').oninput=e=>{PV.alg=CC.parse(e.target.value);PV.pi=0;PV.playing=0;PV.base=null;pui()};
  $('#pp').onclick=()=>{$('#pa').style.filter='';$('#pm').style.visibility='';PV.toggle()};
  $('#ps').onclick=()=>PV.step();$('#pv').onclick=()=>PV.back();
  $('#pr').onclick=()=>{PV.base=null;PV.cube.reset();PV.pi=0;PV.playing=0;PV.hist=[];pui()};
  $('#pst').onclick=()=>{$('#pa').style.filter='';$('#pm').style.visibility='';PV.setup()};
  $('#psc').onclick=()=>{const s=scramble('3x3');PV.cube.reset();PV.alg=CC.parse($('#pa').value);PV.pi=0;PV.playing=0;PV.hist=[];PV.base=null;CC.parse(s).forEach(m=>PV.cube.instant(m));$('#pn').textContent=t('scrambleLbl')+' '+s;pui()};
  $('#pun').onclick=()=>PV.undoAll();
  $('#psp').oninput=e=>PV.cube.speed=+e.target.value;$('#pfo').onchange=e=>PV.cube.follow=e.target.checked?1:0;
  $('#prn').onclick=()=>{let pool=CASES[$('#ptc').value];if(S.f_learn&&$('#plo').checked){const l=pool.filter(isL);if(l.length)pool=l;else toast(t('noLearned'))}const c=R(pool);setPrac(R(c.algs),c.n)};
  $('#phd').onchange=()=>{const h=$('#phd').checked;$('#pa').style.filter=h?'blur(7px)':'';$('#pm').style.visibility=h?'hidden':''};
  $('#ppick').onclick=()=>{const k=$('#ptc').value,pool=CASES[k];
   showDlg(`<h3>${t('pickLearned')} · ${k}</h3><div class="pb"><button class="btn sm" id="pall">${t('selAll')}</button><button class="btn sm" id="pnone">${t('selNone')}</button></div><div id="plist" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px;max-height:50vh;overflow:auto">${pool.map((c,i)=>`<label style="flex-direction:row;align-items:center;gap:6px;color:var(--tx)"><input type="checkbox" data-i="${i}" ${isL(c)?'checked':''}>${c.n.replace(k+' ','')}</label>`).join('')}</div><div class="bt"><button class="btn pri" id="dok">${t('save')}</button></div>`);
   const boxes=()=>$$('#plist input');$('#pall').onclick=()=>boxes().forEach(x=>x.checked=true);$('#pnone').onclick=()=>boxes().forEach(x=>x.checked=false);
   $('#dok').onclick=()=>{boxes().forEach(x=>{S.learned[ckey(pool[+x.dataset.i])]=x.checked});save();closeDlg(null);$('#plo').checked=true;checkAch()}};
  $('#pclose').onclick=closeViewer;
  D.addEventListener('keydown',e=>{if(!pracVisible()||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||anyModalNoPrac())return;const k=e.key.toUpperCase();if('URFDLB'.includes(k)&&k.length==1&&!e.ctrlKey&&!e.metaKey)PV.manual({f:k,n:e.shiftKey?-1:1,t:k})});
  setPrac("R U R' U'",t('sexy'))}
 $('#plw').style.display=S.f_learn?'':'none';
 PV.cube.start();pui()}
const pracVisible=()=>D.body.dataset.v=='prac'||$('#prac').classList.contains('ovl');
const anyModalNoPrac=()=>$$('.modal.on').length>0;
function openViewer(alg,name){$('#prac').classList.add('ovl');initPrac();setPrac(alg,name)}
function closeViewer(){$('#prac').classList.remove('ovl');if(PV&&D.body.dataset.v!='prac'){PV.cube.stop();PV.playing=0}}
/* ---------- view switching ---------- */
function setView(v){D.body.dataset.v=v;$$('#tabs .tab').forEach(x=>x.classList.toggle('on',x.dataset.v==v));
 if(PV&&v!='prac'&&!$('#prac').classList.contains('ovl')){PV.cube.stop();PV.playing=0}
 if(SVP&&v!='solver'){SVP.cube.stop();SVP.playing=0}
 if(v=='stats')fullStats();else if(v=='algs')renderAlgs();else if(v=='prac'){$('#prac').classList.remove('ovl');initPrac()}else if(v=='solver')renderSolver();else{render();setTimeout(chart,0)}}
$('#tabs').onclick=e=>{const b=e.target.closest('.tab');if(b)setView(b.dataset.v)};

 if(s){const sw=s.videoWidth||s.naturalWidth||s.width,sh=s.videoHeight||s.naturalHeight||s.height;if(sw&&sh){const k=Math.min(w/sw,h/sh),dw=sw*k,dh=sh*k;og.drawImage(s,(w-dw)/2,(h-dh)/2,dw,dh)}}

function scanSample(){const n=SC.n,o=SC.off,og=o.getContext('2d',{willReadFrequently:true}),w=o.width,h=o.height,sz=SC.g.s*Math.min(w,h),gx=SC.g.x*w-sz/2,gy=SC.g.y*h-sz/2,cs=sz/n,hs=Math.max(2,Math.floor(cs*.13)),out=[];
 for(let r=0;r<n;r++)for(let k=0;k<n;k++){const cx=Math.round(gx+(k+.5)*cs),cy=Math.round(gy+(r+.5)*cs);let d;try{d=og.getImageData(Math.max(0,cx-hs),Math.max(0,cy-hs),hs*2,hs*2).data}catch(e){return null}let R_=0,G_=0,B_=0,m=0;for(let i=0;i<d.length;i+=4){R_+=d[i];G_+=d[i+1];B_+=d[i+2];m++}out.push([R_/m,G_/m,B_/m])}return out}

function sha256(s){const K=[];let n=2;for(let i=0;i<64;n++){let p=1;for(let j=2;j*j<=n;j++)if(n%j==0){p=0;break}if(p){K[i++]=(Math.pow(n,1/3)%1*4294967296)|0}}

 const b=Array.from(new TextEncoder().encode(s)),l=b.length*8;b.push(128);while(b.length%64!=56)b.push(0);for(let i=7;i>=0;i--)b.push(i>3?0:(l>>>(i*8))&255);
 const R=(x,k)=>x>>>k|x<<32-k;
 for(let o=0;o<b.length;o+=64){const w=[];for(let i=0;i<16;i++)w[i]=b[o+i*4]<<24|b[o+i*4+1]<<16|b[o+i*4+2]<<8|b[o+i*4+3];
  for(let i=16;i<64;i++){const a=R(w[i-15],7)^R(w[i-15],18)^w[i-15]>>>3,c=R(w[i-2],17)^R(w[i-2],19)^w[i-2]>>>10;w[i]=w[i-16]+a+w[i-7]+c|0}
  let[a,bb,c,d,e,f,g,h]=H;for(let i=0;i<64;i++){const t1=h+(R(e,6)^R(e,11)^R(e,25))+(e&f^~e&g)+K[i]+w[i]|0,t2=(R(a,2)^R(a,13)^R(a,22))+(a&bb^a&c^bb&c)|0;h=g;g=f;f=e;e=d+t1|0;d=c;c=bb;bb=a;a=t1+t2|0}
  H[0]=H[0]+a|0;H[1]=H[1]+bb|0;H[2]=H[2]+c|0;H[3]=H[3]+d|0;H[4]=H[4]+e|0;H[5]=H[5]+f|0;H[6]=H[6]+g|0;H[7]=H[7]+h|0}
 return H.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('')}
